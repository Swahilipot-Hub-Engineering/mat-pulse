<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mat-Pulse | Kenya Real-Time Public Transit & GTFS</title>
  <!-- Tailwind CSS CDN for lightweight styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Top Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between z-20 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center font-bold text-white shadow">
        🚐
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight flex items-center gap-2">
          Mat-Pulse
          <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-300 font-normal border border-emerald-700">Kenya Transit Live</span>
        </h1>
        <p class="text-xs text-slate-400">Swahilipot Hub Engineering · National Open GTFS & Telemetry Engine</p>
      </div>
    </div>

    <!-- Quick Stats & GTFS Link -->
    <div class="flex items-center space-x-4">
      <div class="hidden sm:flex items-center gap-2 bg-slate-900/60 px-3 py-1.5 rounded-md border border-slate-700">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="stat-active-vehicles" class="text-xs font-semibold text-slate-200">0 Active Vehicles</span>
      </div>
      <a href="/api/v1/gtfs-rt/vehicle-positions.json" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded transition font-medium">
        GTFS-RT Feed
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex relative overflow-hidden">

    <!-- Sidebar / Drawer -->
    <aside id="sidebar" class="w-full sm:w-96 bg-slate-800/95 backdrop-blur border-r border-slate-700 flex flex-col z-10 transition-all duration-300 max-h-full">
      
      <!-- Region & Route Selectors -->
      <div class="p-3 border-b border-slate-700 space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">Region / City</label>
          <select id="region-filter" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
            <!-- Populated via API -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">Corridor / Route</label>
          <select id="route-filter" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
            <option value="ALL">All Routes</option>
          </select>
        </div>
      </div>

      <!-- Live Matatus List -->
      <div class="flex-1 overflow-y-auto p-3 space-y-3">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Live Matatus & Busses</h2>
          <span id="vehicle-count-badge" class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </div>
        <div id="vehicles-list" class="space-y-2.5">
          <div class="text-center py-8 text-slate-500 text-sm">
            <p>No active vehicles in this area.</p>
            <p class="text-xs mt-1">Start the simulator to stream live telemetry across Kenya!</p>
          </div>
        </div>
      </div>

      <!-- Quick Action / Simulation Panel -->
      <div class="p-3 border-t border-slate-700 bg-slate-900/40">
        <div class="flex gap-2">
          <button id="btn-simulate" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition flex items-center justify-center gap-1.5">
            <span>⚡</span> <span id="sim-btn-text">Send Simulated Ping</span>
          </button>
          <button id="btn-refresh" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 px-3 rounded-lg transition" title="Refresh">
            ↻
          </button>
        </div>
      </div>
    </aside>

    <!-- Map Canvas -->
    <main class="flex-1 h-full relative">
      <div id="map" class="w-full h-full bg-slate-950"></div>

      <!-- Map Legend Overlay -->
      <div id="map-legend" class="absolute bottom-5 right-5 bg-slate-800/90 backdrop-blur p-3 rounded-lg border border-slate-700 text-xs shadow-lg z-[1000] hidden sm:block max-w-xs">
        <div class="font-semibold text-slate-300 mb-2">Corridors in View</div>
        <div id="legend-items" class="space-y-1.5">
          <!-- Dynamically populated -->
        </div>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>

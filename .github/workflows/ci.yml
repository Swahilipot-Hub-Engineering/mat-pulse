name: CI

# Stack-aware CI. It detects the project type and runs the right checks, so it
# works unchanged in the template repository (which has no application code yet)
# and in Node, Python, or other projects as they grow.
#
# When your stack is settled, feel free to delete the branches you do not need
# and make this workflow simpler and stricter.

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if [ ! -f package.json ] && [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "::notice::No application code detected yet. CI will activate automatically once you add it."
          fi

  node:
    name: Lint, test and build
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # Each check runs only if the script exists, so this grows with the project.
      - name: Lint
        run: |
          if npm run --silent 2>/dev/null | grep -qE '^\s+lint$'; then
            npm run lint
          else
            echo "::notice::No 'lint' script defined — skipping."
          fi

      - name: Typecheck
        run: |
          if npm run --silent 2>/dev/null | grep -qE '^\s+typecheck$'; then
            npm run typecheck
          else
            echo "::notice::No 'typecheck' script defined — skipping."
          fi

      - name: Test
        run: |
          if npm run --silent 2>/dev/null | grep -qE '^\s+test$'; then
            npm test
          else
            echo "::warning::No 'test' script defined. Add automated tests when you can."
          fi

      - name: Build
        run: |
          if npm run --silent 2>/dev/null | grep -qE '^\s+build$'; then
            npm run build
          else
            echo "::notice::No 'build' script defined — skipping."
          fi

  python:
    name: Lint and test (Python)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi

      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "::notice::ruff not installed — skipping lint."
          fi

      - name: Test
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest -q
          else
            echo "::warning::pytest not installed. Add automated tests when you can."
          fi

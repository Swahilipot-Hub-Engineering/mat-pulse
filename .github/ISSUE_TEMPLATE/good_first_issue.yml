name: 🌟 Good first issue (maintainers)
description: Create a well-specified starter task for a new contributor
title: "good first issue: "
labels: ["good first issue", "level:beginner", "mentored", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        ### For maintainers and mentors

        A good first issue is a **teaching artefact**, not just a small task. Someone who has
        never opened this codebase should be able to complete it from this description alone.

        If you cannot fill in "Files to look at" and "How to verify", it is not a good first
        issue yet — use `help wanted` instead.

        > 🙋 **New contributor reading this?** You are in the right place. Comment below to
        > claim this issue and a mentor will assign it to you.

  - type: textarea
    id: task
    attributes:
      label: What needs to be done
      description: Plain language, no internal jargon. Assume no prior context.
      placeholder: |
        The "Tickets" button on the home page currently does nothing. It should navigate to
        the /tickets page when clicked.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: A sentence on the user-facing value. Context makes the work feel worth doing.
      placeholder: Visitors cannot reach the ticket page from the home page, so we lose sign-ups.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files to look at
      description: Actual paths, with a note on what each one does.
      placeholder: |
        - `src/pages/Home.tsx` — contains the hero section with the button
        - `src/App.tsx` — where routes are registered (the /tickets route already exists)
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: A hint, not a full solution. Leave room for the contributor to think.
      placeholder: |
        Look at how the "About" link in `Navbar.tsx` uses React Router's `<Link>` component,
        and apply the same pattern to the button.
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: How to verify your work
      description: The exact commands and the observable result.
      placeholder: |
        1. Run `npm run dev` and open http://localhost:8080
        2. Click the "Get tickets" button on the home page
        3. The URL should change to /tickets and the ticket page should render
        4. Run `npm run lint` — it should pass with no new warnings
    validations:
      required: true

  - type: input
    id: mentor
    attributes:
      label: Mentor
      description: The GitHub handle of the person who will answer questions on this issue.
      placeholder: "@username"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Estimated effort
      options:
        - XS — under 2 hours
        - S — half a day
        - M — 1 to 2 days
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Helpful resources
      description: Links to docs, similar past PRs, or a tutorial.
      placeholder: |
        - React Router docs: https://reactrouter.com/en/main/components/link
        - A similar past change: #87
    validations:
      required: false

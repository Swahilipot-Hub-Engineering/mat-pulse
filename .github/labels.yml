# Source of truth for this repository's labels.
# Applied automatically by .github/workflows/labels-sync.yml on push to main,
# or manually with: ../scripts/sync-labels.sh <repo>

# ── type: what kind of work (exactly one) ────────────────────────────────────
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance, dependencies, tooling"
- name: "type:refactor"
  color: "fbca04"
  description: "Internal change with no behaviour change"
- name: "type:design"
  color: "d876e3"
  description: "UI, UX and design assets"
- name: "type:question"
  color: "cc317c"
  description: "Needs clarification"

# ── priority: urgency (exactly one) ──────────────────────────────────────────
- name: "priority:critical"
  color: "b60205"
  description: "Drop everything — outage or data risk"
- name: "priority:high"
  color: "d93f0b"
  description: "Should land this sprint"
- name: "priority:normal"
  color: "fbca04"
  description: "Scheduled normally"
- name: "priority:low"
  color: "c2e0c6"
  description: "Nice to have"

# ── status: where it is stuck ────────────────────────────────────────────────
- name: "status:needs-triage"
  color: "ededed"
  description: "Not yet reviewed by a maintainer"
- name: "status:ready"
  color: "0e8a16"
  description: "Specified and unblocked — ready to be picked up"
- name: "status:blocked"
  color: "000000"
  description: "Waiting on something external"
- name: "status:needs-info"
  color: "fef2c0"
  description: "Waiting on the reporter"
- name: "status:in-review"
  color: "5319e7"
  description: "Pull request under review"

# ── area: part of the system ─────────────────────────────────────────────────
- name: "area:frontend"
  color: "1d76db"
  description: "Web UI"
- name: "area:backend"
  color: "1d76db"
  description: "APIs and services"
- name: "area:mobile"
  color: "1d76db"
  description: "Mobile application"
- name: "area:data"
  color: "1d76db"
  description: "Data, analytics and pipelines"
- name: "area:infra"
  color: "1d76db"
  description: "CI/CD, hosting and configuration"
- name: "area:design"
  color: "1d76db"
  description: "Design and UX"
- name: "area:accessibility"
  color: "1d76db"
  description: "Accessibility"

# ── contributor-facing ───────────────────────────────────────────────────────
# Keep these two names exactly as GitHub expects them — GitHub's own discovery
# pages and the repository "Contribute" tab depend on the literal strings.
- name: "good first issue"
  color: "7057ff"
  description: "Reserved for first-time contributors — fully specified with guidance"
- name: "help wanted"
  color: "008672"
  description: "Maintainers would welcome outside help"
- name: "level:beginner"
  color: "bfdadc"
  description: "Little prior context needed"
- name: "level:intermediate"
  color: "bfdadc"
  description: "Comfortable with the stack"
- name: "level:advanced"
  color: "bfdadc"
  description: "Deep context or design judgement needed"
- name: "mentored"
  color: "fbca04"
  description: "A named mentor is supporting this issue"
- name: "onboarding"
  color: "7057ff"
  description: "New contributor joining or onboarding"
- name: "project-proposal"
  color: "0e8a16"
  description: "A proposal for a new Swahilipot innovation project"

# ── meta ─────────────────────────────────────────────────────────────────────
- name: "security"
  color: "b60205"
  description: "Security-related — consider a private advisory instead"
- name: "breaking-change"
  color: "b60205"
  description: "Requires changes from existing users"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Decided not to act on this"

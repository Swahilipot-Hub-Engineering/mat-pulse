version: 2
updates:
  # ── Application dependencies ────────────────────────────────────────────────
  - package-ecosystem: "npm"        # change to pip / gradle / pub as appropriate
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    target-branch: "staging"
    labels:
      - "type:chore"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Group minor and patch bumps into one PR to keep review load sane
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "type:chore"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
